<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download stillUp™</title>
<meta name="description" content="stillUp — for women in menopause who are still up. So are we.">
<meta property="og:title" content="Download stillUp™">
<meta property="og:description" content="See who's awake. You're not alone. So are we.">
<script>
  // Paste the two store links here
  var IOS_URL = "https://apps.apple.com/us/app/stillup-menopause-community/id6813928472";
  var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.stillupconnections.app";

  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (isIOS) { window.location.replace(IOS_URL); }
  else if (isAndroid) { window.location.replace(ANDROID_URL); }
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("ios").href = IOS_URL;
    document.getElementById("android").href = ANDROID_URL;
  });
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: radial-gradient(ellipse at top, #2a2350 0%, #0d0b1f 70%); color:#fff;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align:center; }
  .wrap { padding: 32px 24px; max-width: 420px; }
  h1 { font-size: 2.6rem; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.5px; }
  h1 span { color:#f5d77a; }
  p { color:#cfcbe8; margin: 0 0 28px; font-size: 1.1rem; }
  a.btn { display:block; margin: 12px 0; padding: 16px; border-radius: 14px; text-decoration:none;
          font-weight:600; font-size:1.05rem; background:#f5d77a; color:#1b1638; }
  a.btn.alt { background: transparent; color:#fff; border: 1.5px solid #f5d77a; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>still<span>U</span>p™</h1>
    <p>Up at night? So are we. ✨</p>
    <a class="btn" id="ios" href="#">Download for iPhone</a>
    <a class="btn alt" id="android" href="#">Get it on Android</a>
  </div>
</body>
</html>
